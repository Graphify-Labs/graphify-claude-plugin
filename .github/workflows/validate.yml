name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check plugin JSON and layout
        run: node scripts/validate-plugin.mjs
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.326
      - name: Validate the plugin
        run: claude plugin validate . --strict --profile directory
